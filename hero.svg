<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Pranab Naskar - BSc IT (AI) student and developer" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0d1630"/></linearGradient>
<linearGradient id="hline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
<pattern id="hdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1b2748"/></pattern>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.name{font-family:Impact,'Arial Narrow Bold','Helvetica Neue',Arial,sans-serif;font-size:76px;fill:#f4f6ff;letter-spacing:1px;animation:rise 1.1s .3s cubic-bezier(.2,.8,.2,1) both}
.hi{font-size:15px;fill:#247bff;animation:fade .8s both}
.role{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:26px;fill:#ff354f}
.pitch{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#aab4d4;animation:fade 1s 1.2s both}
.meta{font-size:13px;fill:#7f8bb0;animation:fade 1s 1.5s both}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<rect width="900" height="300" rx="22" fill="url(#hbg)"/>
<rect width="900" height="300" rx="22" fill="url(#hdots)"/>
<rect x="1" y="1" width="898" height="298" rx="21" fill="none" stroke="url(#hline)" stroke-opacity=".6" stroke-width="2"/>
<text x="60" y="62" class="mono hi">&gt; hello_world<animate attributeName="opacity" values="1;.4;1" dur="1.6s" repeatCount="indefinite"/></text>
<text x="60" y="140" class="name">PRANAB NASKAR</text>
<text x="60" y="196" class="role" opacity="1">Aspiring AI Engineer<animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.23;0.25;0.98;1" values="1;1;0;0;1"/></text>
<text x="60" y="196" class="role" opacity="0">Python Developer<animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.27;0.48;0.5;1" values="0;0;1;1;0;0"/></text>
<text x="60" y="196" class="role" opacity="0">UI / UX Designer<animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.5;0.52;0.73;0.75;1" values="0;0;1;1;0;0"/></text>
<text x="60" y="196" class="role" opacity="0">Hackathon Builder<animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.75;0.77;0.98;1" values="0;0;1;1;0"/></text>

<text x="60" y="236" class="pitch">I build efficient, scalable things. Code. Learn. Build. Repeat.</text>
<text x="60" y="268" class="mono meta">BSc IT (AI)  •  MAKAUT, West Bengal  •  Year 02</text>
<circle cx="800" cy="70" r="46" fill="none" stroke="#247bff" stroke-width="2" stroke-dasharray="6 10"><animateTransform attributeName="transform" type="rotate" from="0 800 70" to="360 800 70" dur="18s" repeatCount="indefinite"/></circle>
<circle cx="800" cy="70" r="26" fill="none" stroke="#ff354f" stroke-width="2" stroke-dasharray="4 8"><animateTransform attributeName="transform" type="rotate" from="360 800 70" to="0 800 70" dur="12s" repeatCount="indefinite"/></circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>