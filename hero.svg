<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Pranab Naskar - AI Enthusiast, Python Developer, UI/UX Designer">
<defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#247bff"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff5fa2"/></linearGradient>
<linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0c1230"/></linearGradient>
<radialGradient id="ho1"><stop offset="0" stop-color="#247bff" stop-opacity=".45"/><stop offset="1" stop-color="#247bff" stop-opacity="0"/></radialGradient>
<radialGradient id="ho2"><stop offset="0" stop-color="#ff5fa2" stop-opacity=".35"/><stop offset="1" stop-color="#ff5fa2" stop-opacity="0"/></radialGradient>
<pattern id="hd" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1a2547"/></pattern>
<clipPath id="hc"><rect width="1000" height="380" rx="26"/></clipPath>
<style>
.hn{font-family:Impact,'Arial Narrow Bold','Helvetica Neue',Arial,sans-serif;font-size:78px;fill:#f4f6ff;letter-spacing:2px;animation:hrise 1.1s .25s cubic-bezier(.2,.8,.2,1) both}
@keyframes hrise{from{transform:translateY(46px);opacity:0}to{transform:none;opacity:1}}
@keyframes hfade{from{opacity:0}to{opacity:1}}
@keyframes hbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<g clip-path="url(#hc)">
<rect width="1000" height="380" fill="url(#hbg)"/><rect width="1000" height="380" fill="url(#hd)"/>
<circle cx="820" cy="80" r="260" fill="url(#ho1)"><animateTransform attributeName="transform" type="translate" values="0 0;-40 30;0 0" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="140" cy="380" r="240" fill="url(#ho2)"><animateTransform attributeName="transform" type="translate" values="0 0;50 -25;0 0" dur="16s" repeatCount="indefinite"/></circle>
<g transform="translate(865 180)" opacity=".95">
<circle r="120" fill="none" stroke="#247bff" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="3 12"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></circle>
<circle r="88" fill="none" stroke="#8b5cf6" stroke-opacity=".7" stroke-width="2" stroke-dasharray="40 24"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/></circle>
<circle r="58" fill="#0e1530" stroke="url(#hg)" stroke-width="2"/>
<text y="14" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="40" font-weight="700" fill="url(#hg)">&lt;/&gt;</text>
<circle r="6" fill="#ff5fa2" cx="120" cy="0"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/></circle>
</g>
<text x="70" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#247bff" letter-spacing="2" style="animation:hfade .8s both">&gt; hello, world<tspan fill="#ff5fa2">_<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
<text x="66" y="205" class="hn" textLength="640" lengthAdjust="spacingAndGlyphs">PRANAB NASKAR</text>
<rect x="70" y="222" width="260" height="4" rx="2" fill="url(#hg)" style="transform-origin:70px 224px;animation:hbar 1s 1s both"/>
<text x="70" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#c7d0ee" style="animation:hfade 1s 1s both">AI Enthusiast<tspan fill="#8b5cf6">  |  </tspan>Python Developer<tspan fill="#ff5fa2">  |  </tspan>UI/UX Designer</text>
<g style="animation:hfade .8s 1.3s both"><rect x="70" y="298" width="129" height="34" rx="17" fill="#0e1530" stroke="url(#hg)" stroke-width="1.3"/><text x="134" y="320" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e8ecff">BSc IT (AI)</text></g><g style="animation:hfade .8s 1.45s both"><rect x="210.6" y="298" width="172" height="34" rx="17" fill="#0e1530" stroke="url(#hg)" stroke-width="1.3"/><text x="296" y="320" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e8ecff">MAKAUT · Year 02</text></g><g style="animation:hfade .8s 1.6s both"><rect x="394.2" y="298" width="223" height="34" rx="17" fill="#0e1530" stroke="url(#hg)" stroke-width="1.3"/><text x="506" y="320" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e8ecff">GDGoC MAKAUT Core Team</text></g>
</g>
<rect x="1" y="1" width="998" height="378" rx="25" fill="none" stroke="url(#hg)" stroke-opacity=".7" stroke-width="2"/>
</svg>