<g class="chip" style="animation-delay:0.4s"><rect x="310" y="70" width="66" height="38" rx="19" fill="#0e1730" stroke="url(#sl)" stroke-width="1.5"/><text x="343.0" y="94" text-anchor="middle" class="ct">C++</text></g>
<text x="50" y="134" class="lbl">WEB</text>
<g class="chip" style="animation-delay:0.5s"><rect x="50" y="148" width="76" height="38" rx="19" fill="#0e1730" stroke="url(#sl)" stroke-width="1.5"/><text x="88.0" y="172" text-anchor="middle" class="ct">HTML</text></g>
<g class="chip" style="animation-delay:0.6s"><rect x="140" y="148" width="66" height="38" rx="19" fill="#0e1730" stroke="url(#sl)" stroke-width="1.5"/><text x="173.0" y="172" text-anchor="middle" class="ct">CSS</text></g>
