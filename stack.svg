<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" width="900" height="392" role="img" aria-label="Tech stack" xmlns:c2pa="http://c2pa.org/manifest">
<defs><linearGradient id="sl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
<style>
.lbl{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;fill:#247bff;letter-spacing:3px}
.ct{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#f4f6ff}
.chip{animation:pop .6s both,bob 4s ease-in-out infinite}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<rect width="900" height="392" rx="22" fill="#070b16"/>
<rect x="1" y="1" width="898" height="390" rx="21" fill="none" stroke="#1b2748" stroke-width="2"/>
<text x="50" y="56" class="lbl">LANGUAGES</text>
<g class="chip" style="animation-delay:0.0s"><rect x="50" y="70" width="96" height="38" rx="19" fill="#0e1730" stroke="url(#sl)" stroke-width="1.5"/><text x="98.0" y="94" text-anchor="middle" class="ct">Python</text></g>
<g class="chip" style="animation-delay:0.1s"><rect x="160" y="70" width="76" height="38" rx="19" fill="#0e1730" stroke="url(#sl)" stroke-width="1.5"/><text x="198.0" y="94" text-anchor="middle" class="ct">Java</text></g>
